name: Build Webflow (three artifacts)

# Publishes the three webflow artifacts:
#   1. webflow-dist.zip                — cross-platform frontend (Vue SPA)
#   2. webflow-cli-<platform>.zip      — CLI binary (PyInstaller, per-platform)
#   3. webflow-server-<platform>.zip   — server binary (PyInstaller, per-platform)
#
# The frontend artifact is cross-platform (built once on ubuntu). The CLI/server
# binaries are per-platform (matrix), packaged as zip bundles of the PyInstaller
# onedir output.

on:
  push:
    branches: [main, feature/workflow-engine]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  frontend:
    name: Frontend (cross-platform dist)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workflow/web/pnpm-lock.yaml

      - name: Install + build frontend
        working-directory: workflow/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Write version info
        run: python scripts/write_webflow_version.py

      - name: Validate Python CLI + backend
        run: |
          python -m compileall -q workflow
          python -m workflow --help > /dev/null

      - name: Package webflow-dist.zip
        run: |
          mkdir -p dist-artifact
          python -c "import shutil; shutil.make_archive('dist-artifact/webflow-dist', 'zip', 'workflow/web/dist')"

      - uses: actions/upload-artifact@v4
        with:
          name: webflow-dist
          path: workflow/web/dist

      - name: Attach webflow-dist.zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifact/webflow-dist.zip

  binary:
    name: CLI + Server (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Platform tag
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*) echo "PTAG=linux" >> "$GITHUB_ENV" ;;
            macos-*) echo "PTAG=macos" >> "$GITHUB_ENV" ;;
            windows-*) echo "PTAG=windows" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frontend dist (for the server bundle)
        uses: actions/download-artifact@v4
        with:
          name: webflow-dist
          path: workflow/web/dist

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build CLI binary
        run: |
          python -m PyInstaller --distpath dist-bin --workpath build-cli packaging/webflow-cli.spec

      - name: Build Server binary (bundles frontend dist)
        run: |
          python -m PyInstaller --distpath dist-bin --workpath build-server packaging/webflow-server.spec

      - name: Package per-platform zips
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -c "import shutil; shutil.make_archive('artifacts/webflow-cli-$PTAG','zip','dist-bin/webflow-cli'); shutil.make_archive('artifacts/webflow-server-$PTAG','zip','dist-bin/webflow-server')"
          else
            # `zip` preserves the executable bit on Linux/macOS so the unpacked
            # binary runs directly.
            (cd dist-bin && zip -qr ../artifacts/webflow-cli-$PTAG.zip webflow-cli && zip -qr ../artifacts/webflow-server-$PTAG.zip webflow-server)
          fi

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webflow-binary-${{ env.PTAG }}
          path: artifacts/

      - name: Attach binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/webflow-cli-${{ env.PTAG }}.zip
            artifacts/webflow-server-${{ env.PTAG }}.zip
