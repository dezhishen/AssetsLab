<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AssetsLab Body Anchor Calibration</title>
  <style>
    :root { color-scheme:dark; --bg:#161827; --panel:#22253a; --line:#414660; --text:#f2f1ee; --muted:#b8bacb; --accent:#8fd3ff; --guide:#66e3a7; }
    * { box-sizing:border-box; }
    body { margin:0; padding:14px; background:linear-gradient(160deg,#151725,#20243a); color:var(--text); font:16px/1.45 system-ui,sans-serif; }
    main { max-width:900px; margin:auto; }
    h1 { margin:0 0 4px; font-size:clamp(22px,5vw,34px); }
    p { color:var(--muted); margin:6px 0 12px; }
    .toolbar,.panel { background:rgba(34,37,58,.95); border:1px solid var(--line); border-radius:14px; padding:12px; margin:12px 0; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
    label { color:var(--muted); }
    select,button,textarea { font:inherit; color:var(--text); background:#303550; border:1px solid #59617f; border-radius:8px; padding:8px 10px; }
    button { cursor:pointer; min-width:42px; }
    button:active { background:#526080; }
    button.active { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .move { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,44px); gap:5px; width:max-content; margin:2px auto; }
    .move button:nth-child(1) { grid-column:2; }
    .move button:nth-child(2) { grid-column:1; grid-row:2; }
    .move button:nth-child(3) { grid-column:2; grid-row:2; }
    .move button:nth-child(4) { grid-column:3; grid-row:2; }
    .move button:nth-child(5) { grid-column:2; grid-row:3; }
    .view { max-width:560px; margin:auto; background:#0d0f19; border:1px solid var(--line); border-radius:12px; padding:8px; }
    .view-title { color:var(--accent); padding:4px 2px 8px; }
    canvas { width:100%; display:block; image-rendering:pixelated; background:#0b0c13; border-radius:8px; }
    .status { color:#c9f5c9; min-height:1.5em; }
    textarea { width:100%; min-height:150px; font:12px/1.35 ui-monospace,Consolas,monospace; }
  </style>
</head>
<body>
<main>
  <h1>身体—头部连接锚定</h1>
  <p>绿色水平线是身体颈部参考线。当前只移动整组头部，身体保持固定；用四方向 Tab 检查头部与肩膀、颈部是否连续。</p>
  <section class="toolbar">
    <div class="row"><label>方向：</label><button data-direction="front">1 正面</button><button data-direction="right">2 右侧</button><button data-direction="back">3 背面</button><button data-direction="left">4 左侧</button></div>
    <div class="row"><label>调整对象：</label><button class="active">整组头部</button><label>步长：</label><select id="step"><option value="1">1 像素</option><option value="2">2 像素</option><option value="0.25">0.25 像素</option></select><button id="reset">重置当前方向</button><button id="resetAll">重置全部</button><button id="save">保存到项目</button><button id="download">下载 JSON</button></div>
    <div class="move"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="center">·</button><button data-move="right">→</button><button data-move="down">↓</button></div>
    <div class="status" id="status"></div>
  </section>
  <section class="panel"><div class="view"><div class="view-title" id="viewTitle"></div><canvas id="canvas"></canvas></div></section>
  <section class="panel"><label for="json">身体连接校准 JSON</label><textarea id="json" spellcheck="false"></textarea></section>
</main>
<script>
const directions=['front','right','back','left'];
const labels={front:'1 · 正面',right:'2 · 右侧',back:'3 · 背面',left:'4 · 左侧'};
const bodyLayers=['feet','lower_body','arms','torso'];
const headLayers=['face_base','ears','face'];
const images={};
let selectedDirection='front';
let calibration={};
function emptyCalibration(){const r={};for(const d of directions)r[d]={x:0,y:0};return r;}
calibration=emptyCalibration();
function frame(image,row){return {sx:0,sy:row*64,sw:64,sh:64};}
async function loadImage(key,path){const image=new Image();image.src=path;await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;});images[key]=image;}
async function loadCalibration(){try{const response=await fetch('calibration/body_latest.json');if(response.ok){const payload=await response.json();if(payload.schema==='body_anchor_calibration_v1')calibration={...emptyCalibration(),...payload.calibration};}}catch(_error){} }
async function load(){
  for(const layer of bodyLayers)await loadImage(layer,`assets/runtime/${layer}_walk_4way.png`);
  for(const layer of headLayers)await loadImage(layer,`assets/runtime/${layer}_walk_4way.png`);
  await loadCalibration();render();
}
function drawLayer(ctx,image,row,dx=0,dy=0,scale=1){const s=frame(image,row);ctx.drawImage(image,s.sx,s.sy,s.sw,s.sh,dx*scale,dy*scale,64*scale,64*scale);}
function render(){
  const canvas=document.getElementById('canvas');const scale=Math.max(4,Math.floor(canvas.clientWidth/64));canvas.width=64*scale;canvas.height=64*scale;
  const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const row=directions.indexOf(selectedDirection);const move=calibration[selectedDirection];
  for(const layer of bodyLayers)drawLayer(ctx,images[layer],row,0,0,scale);
  for(const layer of headLayers)drawLayer(ctx,images[layer],row,move.x,move.y,scale);
  ctx.strokeStyle='#66e3a7';ctx.lineWidth=scale;ctx.beginPath();ctx.moveTo(0,30*scale);ctx.lineTo(64*scale,30*scale);ctx.stroke();
  ctx.fillStyle='#66e3a7';ctx.font=`${Math.max(10,scale*2)}px system-ui`;ctx.fillText('body neck guide',2*scale,29*scale);
  document.getElementById('viewTitle').textContent=`${labels[selectedDirection]} · 当前头部偏移 x=${move.x}, y=${move.y}`;
  document.getElementById('status').textContent=`${labels[selectedDirection]} / 整组头部 / x=${move.x}, y=${move.y}`;
  document.getElementById('json').value=JSON.stringify({schema:'body_anchor_calibration_v1',created_at:new Date().toISOString(),calibration},null,2);
  document.querySelectorAll('[data-direction]').forEach(b=>b.classList.toggle('active',b.dataset.direction===selectedDirection));
}
function move(dx,dy){const step=Number(document.getElementById('step').value);const item=calibration[selectedDirection];item.x=Number((item.x+dx*step).toFixed(2));item.y=Number((item.y+dy*step).toFixed(2));render();}
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{selectedDirection=b.dataset.direction;render();});
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],left:[-1,0],center:[0,0],right:[1,0],down:[0,1]}[b.dataset.move];if(b.dataset.move!=='center')move(m[0],m[1]);});
document.getElementById('reset').onclick=()=>{calibration[selectedDirection]={x:0,y:0};render();};
document.getElementById('resetAll').onclick=()=>{calibration=emptyCalibration();render();};
document.getElementById('download').onclick=()=>{const blob=new Blob([document.getElementById('json').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='body_anchor_calibration.json';a.click();URL.revokeObjectURL(a.href);};
document.getElementById('save').onclick=async()=>{try{const response=await fetch('/api/save-calibration',{method:'POST',headers:{'Content-Type':'application/json'},body:document.getElementById('json').value});if(!response.ok)throw new Error(await response.text());document.getElementById('status').textContent='已保存到 prototype/preview/calibration/body_latest.json；重新生成预览后生效。';}catch(error){document.getElementById('status').textContent='保存失败，请下载 JSON：'+error;}};
load().catch(error=>document.getElementById('status').textContent='加载失败：'+error);
</script>
</body>
</html>
