<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>身体轮廓像素编辑器</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #10131d; color: #edf1ff; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #b9c2df; line-height: 1.55; }
    .toolbar, .frames, .actions, .colors { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
    button { color: inherit; background: #222a40; border: 1px solid #3c496b; border-radius: 7px; padding: 7px 10px; cursor: pointer; font: inherit; }
    button:hover, button.active { background: #425986; border-color: #8fc4ff; }
    .workspace { display: grid; grid-template-columns: minmax(300px, 512px) minmax(250px, 1fr); gap: 18px; align-items: start; }
    canvas { display: block; width: min(100%, 512px); aspect-ratio: 1; background: #090b12; border: 1px solid #3c496b; border-radius: 10px; touch-action: none; image-rendering: pixelated; }
    .panel { padding: 14px; background: #181d2c; border: 1px solid #303b57; border-radius: 10px; }
    .swatch { width: 24px; height: 24px; padding: 0; border-radius: 5px; }
    .color-input { width: 42px; height: 34px; padding: 2px; border: 1px solid #3c496b; background: #222a40; }
    #status, .hint { color: #aeb9d9; font-size: .9rem; line-height: 1.55; }
    @media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>身体轮廓像素编辑器（右向 8 帧）</h1>
  <p>这里直接修改原图像素。每个小格就是一个 1×1 像素：画笔可以填格子，橡皮可以擦成透明。网格始终显示，不再使用不精确的分割线。</p>
  <div class="frames" id="frames"></div>
  <div class="workspace">
    <canvas id="board" width="512" height="512"></canvas>
    <section class="panel">
      <div class="toolbar">
        <button id="brush" class="active">画笔</button>
        <button id="eraser">橡皮擦</button>
        <button id="picker">取色</button>
        <button id="gridToggle" class="active">显示网格</button>
      </div>
      <div class="colors">
        <button class="swatch" data-color="#2b1c18" style="background:#2b1c18" title="轮廓色"></button>
        <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="填充色"></button>
        <input id="color" class="color-input" type="color" value="#2b1c18" title="自定义颜色">
      </div>
      <div class="actions">
        <button id="undo">撤销</button>
        <button id="copyPrev">复制上一帧</button>
        <button id="resetFrame">恢复当前帧</button>
        <button id="resetAll">恢复全部</button>
      </div>
      <div class="actions">
        <button id="play">播放</button>
        <button id="download">下载 PNG</button>
        <button id="exportProject">导出工程 JSON</button>
        <button id="save">保存到预览服务器</button>
      </div>
      <div id="status"></div>
      <p class="hint">建议先用橡皮擦去错误的内部线，再用轮廓色或白色逐格修补。PNG 用于直接查看；“导出工程 JSON”会保存每一帧的全部像素信息，之后可放回项目中继续处理。</p>
    </section>
  </div>
</main>

  function buildSheet() { const sheet = document.createElement('canvas'); sheet.width = SIZE * FRAME_COUNT; sheet.height = SIZE; const sheetCtx = sheet.getContext('2d'); frames.forEach((pixels, index) => sheetCtx.putImageData(new ImageData(pixels, SIZE, SIZE), index * SIZE, 0)); return sheet; }
  document.getElementById('download').onclick = () => { const link = document.createElement('a'); link.href = buildSheet().toDataURL('image/png'); link.download = 'body_outline_split_v2_manual.png'; link.click(); };
  function bytesToBase64(bytes) { let binary = ''; const chunkSize = 0x8000; for (let index = 0; index < bytes.length; index += chunkSize) binary += String.fromCharCode(...bytes.subarray(index, Math.min(index + chunkSize, bytes.length))); return btoa(binary); }
  document.getElementById('exportProject').onclick = () => {
    const project = { schema: 'body_outline_pixel_project_v1', width: SIZE, height: SIZE, frame_count: FRAME_COUNT, frames_rgba_base64: frames.map(bytesToBase64), current_frame: frameIndex, color, exported_at: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'body_outline_split_v2_manual.project.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    document.getElementById('status').textContent = '已导出 body_outline_split_v2_manual.project.json';
  };
  document.getElementById('save').onclick = async () => { try { const pngBase64 = buildSheet().toDataURL('image/png').split(',')[1]; const response = await fetch('/api/save-pixel-art', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ schema: 'body_outline_pixel_edit_v1', file_name: 'body_outline_split_v2_manual.png', png_base64: pngBase64 }) }); if (!response.ok) throw new Error(await response.text()); document.getElementById('status').textContent = '已保存 body_outline_split_v2_manual.png'; } catch (error) { document.getElementById('status').textContent = `保存失败，请下载 PNG：${error}`; } };
  source.onload = initialize;
</script>
</body>
