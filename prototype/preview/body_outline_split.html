<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>身体轮廓像素编辑器</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #10131d; color: #edf1ff; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #b9c2df; line-height: 1.55; }
    .toolbar, .frames, .actions, .colors { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
    button { color: inherit; background: #222a40; border: 1px solid #3c496b; border-radius: 7px; padding: 7px 10px; cursor: pointer; font: inherit; }
    button:hover, button.active { background: #425986; border-color: #8fc4ff; }
    .workspace { display: grid; grid-template-columns: minmax(300px, 512px) minmax(250px, 1fr); gap: 18px; align-items: start; }
    canvas { display: block; width: min(100%, 512px); aspect-ratio: 1; background: #090b12; border: 1px solid #3c496b; border-radius: 10px; touch-action: none; image-rendering: pixelated; }
    .panel { padding: 14px; background: #181d2c; border: 1px solid #303b57; border-radius: 10px; }
    .swatch { width: 24px; height: 24px; padding: 0; border-radius: 5px; }
    .color-input { width: 42px; height: 34px; padding: 2px; border: 1px solid #3c496b; background: #222a40; }
    #status, .hint { color: #aeb9d9; font-size: .9rem; line-height: 1.55; }
    @media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>身体轮廓像素编辑器（右向 8 帧）</h1>
  <p>这里直接修改原图像素。每个小格就是一个 1×1 像素：画笔可以填格子，橡皮可以擦成透明。网格始终显示，不再使用不精确的分割线。</p>
  <div class="frames" id="frames"></div>
  <div class="workspace">
    <canvas id="board" width="512" height="512"></canvas>
    <section class="panel">
      <div class="toolbar">
        <button id="brush" class="active">画笔</button>
        <button id="eraser">橡皮擦</button>
        <button id="picker">取色</button>
        <button id="gridToggle" class="active">显示网格</button>
      </div>
      <div class="colors">
        <button class="swatch" data-color="#2b1c18" style="background:#2b1c18" title="轮廓色"></button>
        <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="填充色"></button>
        <input id="color" class="color-input" type="color" value="#2b1c18" title="自定义颜色">
      </div>
      <div class="actions">
        <button id="undo">撤销</button>
        <button id="copyPrev">复制上一帧</button>
        <button id="resetFrame">恢复当前帧</button>
        <button id="resetAll">恢复全部</button>
      </div>
      <div class="actions">
        <button id="play">播放</button>
        <button id="download">下载 PNG</button>
        <button id="save">保存到预览服务器</button>
      </div>
      <div id="status"></div>
      <p class="hint">建议先用橡皮擦去错误的内部线，再用轮廓色或白色逐格修补。保存后的文件名是 <code>body_outline_split_v2_manual.png</code>，后续会以它作为精细化处理输入。</p>
    </section>
  </div>
</main>
<script>
  const SIZE = 64;
  const FRAME_COUNT = 8;
  const SCALE = 8;
  const source = new Image();
  source.src = 'assets/body_outline_split_v2_right_walk_8.png';
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const sourceCanvas = document.createElement('canvas');
  sourceCanvas.width = SIZE * FRAME_COUNT;
  sourceCanvas.height = SIZE;
  const sourceCtx = sourceCanvas.getContext('2d');
  let frames = [];
  let originalFrames = [];
  let undoStack = [];
  let frameIndex = 0;
  let tool = 'brush';
  let color = '#2b1c18';
  let showGrid = true;
  let drawing = false;
  let lastCell = null;
  let playing = false;
  let timer = null;

  const cloneFrames = values => values.map(value => new Uint8ClampedArray(value));
  function remember() { undoStack.push(cloneFrames(frames)); if (undoStack.length > 40) undoStack.shift(); }
  function hexRgb(value) { const number = parseInt(value.slice(1), 16); return [(number >> 16) & 255, (number >> 8) & 255, number & 255]; }
  function cell(event) {
    const rect = board.getBoundingClientRect();
    return [Math.max(0, Math.min(63, Math.floor((event.clientX - rect.left) / rect.width * SIZE))), Math.max(0, Math.min(63, Math.floor((event.clientY - rect.top) / rect.height * SIZE)))];
  }
  function setPixel(x, y) {
    const index = (y * SIZE + x) * 4;
    const pixel = frames[frameIndex];
    if (tool === 'eraser') { pixel[index] = 0; pixel[index + 1] = 0; pixel[index + 2] = 0; pixel[index + 3] = 0; }
    else if (tool === 'brush') { const rgb = hexRgb(color); pixel[index] = rgb[0]; pixel[index + 1] = rgb[1]; pixel[index + 2] = rgb[2]; pixel[index + 3] = 255; }
    else if (tool === 'picker') { if (pixel[index + 3] === 0) { tool = 'eraser'; } else { color = '#' + [pixel[index], pixel[index + 1], pixel[index + 2]].map(value => value.toString(16).padStart(2, '0')).join(''); tool = 'brush'; document.getElementById('color').value = color; } }
  }
  function drawGrid() {
    if (!showGrid) return;
    ctx.save();
    ctx.lineWidth = 1;
    for (let i = 0; i <= SIZE; i++) {
      ctx.strokeStyle = i % 8 === 0 ? '#8fc4ff66' : '#ffffff1c';
      ctx.beginPath(); ctx.moveTo(i * SCALE + .5, 0); ctx.lineTo(i * SCALE + .5, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * SCALE + .5); ctx.lineTo(512, i * SCALE + .5); ctx.stroke();
    }
    ctx.restore();
  }
  function render() {
    ctx.fillStyle = '#090b12'; ctx.fillRect(0, 0, 512, 512);
    const pixelCanvas = document.createElement('canvas'); pixelCanvas.width = SIZE; pixelCanvas.height = SIZE;
    const pixelCtx = pixelCanvas.getContext('2d');
    pixelCtx.putImageData(new ImageData(frames[frameIndex], SIZE, SIZE), 0, 0);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(pixelCanvas, 0, 0, SIZE, SIZE, 0, 0, 512, 512);
    drawGrid();
    document.querySelectorAll('#frames button').forEach((button, index) => button.classList.toggle('active', index === frameIndex));
    for (const id of ['brush', 'eraser', 'picker']) document.getElementById(id).classList.toggle('active', tool === id);
    const pixel = frames[frameIndex];
    document.getElementById('status').textContent = `第 ${frameIndex + 1}/8 帧；工具：${tool === 'brush' ? '画笔' : tool === 'eraser' ? '橡皮擦' : '取色'}；像素 ${pixel.length / 4}`;
  }
  function buildButtons() {
    const box = document.getElementById('frames');
    for (let index = 0; index < FRAME_COUNT; index++) { const button = document.createElement('button'); button.textContent = `${index + 1} 帧`; button.onclick = () => { frameIndex = index; render(); }; box.appendChild(button); }
  }
  function initialize() {
    sourceCtx.imageSmoothingEnabled = false; sourceCtx.drawImage(source, 0, 0, sourceCanvas.width, sourceCanvas.height);
    const data = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data;
    frames = []; for (let frame = 0; frame < FRAME_COUNT; frame++) { const pixels = new Uint8ClampedArray(SIZE * SIZE * 4); for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) { const sourceIndex = (y * sourceCanvas.width + frame * SIZE + x) * 4; const targetIndex = (y * SIZE + x) * 4; pixels[targetIndex] = data[sourceIndex]; pixels[targetIndex + 1] = data[sourceIndex + 1]; pixels[targetIndex + 2] = data[sourceIndex + 2]; pixels[targetIndex + 3] = data[sourceIndex + 3]; } frames.push(pixels); }
    originalFrames = cloneFrames(frames); buildButtons(); render();
  }
  board.addEventListener('pointerdown', event => { if (!frames.length) return; remember(); drawing = true; lastCell = null; board.setPointerCapture(event.pointerId); const next = cell(event); setPixel(next[0], next[1]); lastCell = next; render(); });
  board.addEventListener('pointermove', event => { if (!drawing) return; const next = cell(event); if (lastCell && next[0] === lastCell[0] && next[1] === lastCell[1]) return; setPixel(next[0], next[1]); lastCell = next; render(); });
  board.addEventListener('pointerup', event => { drawing = false; lastCell = null; if (board.hasPointerCapture(event.pointerId)) board.releasePointerCapture(event.pointerId); });
  board.addEventListener('pointercancel', () => { drawing = false; lastCell = null; render(); });
  document.getElementById('brush').onclick = () => { tool = 'brush'; render(); };
  document.getElementById('eraser').onclick = () => { tool = 'eraser'; render(); };
  document.getElementById('picker').onclick = () => { tool = 'picker'; render(); };
  document.getElementById('gridToggle').onclick = event => { showGrid = !showGrid; event.currentTarget.classList.toggle('active', showGrid); render(); };
  document.querySelectorAll('[data-color]').forEach(button => button.onclick = () => { color = button.dataset.color; document.getElementById('color').value = color; tool = 'brush'; render(); });
  document.getElementById('color').oninput = event => { color = event.target.value; tool = 'brush'; render(); };
  document.getElementById('undo').onclick = () => { const previous = undoStack.pop(); if (previous) { frames = previous; render(); } };
  document.getElementById('copyPrev').onclick = () => { if (frameIndex > 0) { remember(); frames[frameIndex] = new Uint8ClampedArray(frames[frameIndex - 1]); render(); } };
  document.getElementById('resetFrame').onclick = () => { remember(); frames[frameIndex] = new Uint8ClampedArray(originalFrames[frameIndex]); render(); };
  document.getElementById('resetAll').onclick = () => { remember(); frames = cloneFrames(originalFrames); render(); };
  document.getElementById('play').onclick = () => { playing = !playing; document.getElementById('play').textContent = playing ? '停止' : '播放'; if (playing) timer = setInterval(() => { frameIndex = (frameIndex + 1) % FRAME_COUNT; render(); }, 150); else clearInterval(timer); };
  function buildSheet() { const sheet = document.createElement('canvas'); sheet.width = SIZE * FRAME_COUNT; sheet.height = SIZE; const sheetCtx = sheet.getContext('2d'); frames.forEach((pixels, index) => sheetCtx.putImageData(new ImageData(pixels, SIZE, SIZE), index * SIZE, 0)); return sheet; }
  document.getElementById('download').onclick = () => { const link = document.createElement('a'); link.href = buildSheet().toDataURL('image/png'); link.download = 'body_outline_split_v2_manual.png'; link.click(); };
  document.getElementById('save').onclick = async () => { try { const pngBase64 = buildSheet().toDataURL('image/png').split(',')[1]; const response = await fetch('/api/save-pixel-art', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ schema: 'body_outline_pixel_edit_v1', file_name: 'body_outline_split_v2_manual.png', png_base64: pngBase64 }) }); if (!response.ok) throw new Error(await response.text()); document.getElementById('status').textContent = '已保存 body_outline_split_v2_manual.png'; } catch (error) { document.getElementById('status').textContent = `保存失败，请下载 PNG：${error}`; } };
  source.onload = initialize;
</script>
</body>
</html>
