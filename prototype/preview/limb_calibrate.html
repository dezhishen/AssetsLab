<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AssetsLab Limb Anchor Calibration</title>
  <style>
    :root { color-scheme: dark; --bg:#161827; --panel:#22253a; --line:#414660; --text:#f2f1ee; --muted:#b8bacb; --accent:#8fd3ff; --guide:#66e3a7; }
    * { box-sizing: border-box; }
    body { margin:0; padding:14px; background:linear-gradient(160deg,#151725,#20243a); color:var(--text); font:16px/1.45 system-ui,sans-serif; }
    main { max-width:920px; margin:auto; }
    h1 { margin:0 0 4px; font-size:clamp(22px,5vw,34px); }
    p { color:var(--muted); margin:6px 0 12px; }
    .toolbar,.panel { background:rgba(34,37,58,.96); border:1px solid var(--line); border-radius:14px; padding:12px; margin:12px 0; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:7px 0; }
    label { color:var(--muted); }
    button,select,textarea { font:inherit; color:var(--text); background:#303550; border:1px solid #59617f; border-radius:8px; padding:8px 10px; }
    button { cursor:pointer; min-width:42px; }
    button.active { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .frames { display:grid; grid-template-columns:repeat(8,minmax(34px,1fr)); gap:5px; }
    .frames button { min-width:0; padding:7px 2px; }
    .move { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,44px); gap:5px; width:max-content; margin:8px auto 2px; }
    .move button:nth-child(1) { grid-column:2; }
    .move button:nth-child(2) { grid-column:1; grid-row:2; }
    .move button:nth-child(3) { grid-column:2; grid-row:2; }
    .move button:nth-child(4) { grid-column:3; grid-row:2; }
    .move button:nth-child(5) { grid-column:2; grid-row:3; }
    .view { max-width:620px; margin:auto; background:#0d0f19; border:1px solid var(--line); border-radius:12px; padding:8px; }
    canvas { width:100%; display:block; image-rendering:pixelated; background:#0b0c13; border-radius:8px; touch-action:none; }
    .status { color:#c9f5c9; min-height:1.5em; }
    textarea { width:100%; min-height:170px; font:12px/1.35 ui-monospace,Consolas,monospace; }
    .hint { font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>右侧身体部件锚定</h1>
  <p>拖动画布中的部件，或用方向键做像素级调整。绿色横线为肩线，蓝线为骨盆拼接线，灰线为脚底基线。当前只校准右侧 8 帧候选。</p>
  <section class="toolbar">
    <div class="row"><label>帧：</label><div class="frames" id="frames"></div></div>
    <div class="row"><label>部件：</label><div id="layers"></div></div>
    <div class="row"><label>步长：</label><select id="step"><option value="1">1 像素</option><option value="0.25">0.25 像素</option><option value="2">2 像素</option></select><button id="reset">重置当前部件</button><button id="resetFrame">重置当前帧</button><button id="resetAll">重置全部</button></div>
    <div class="move"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="center">·</button><button data-move="right">→</button><button data-move="down">↓</button></div>
    <div class="row"><button id="save">保存到项目</button><button id="download">下载 JSON</button></div>
    <div class="status" id="status"></div>
  </section>
  <section class="panel"><div class="view"><canvas id="canvas"></canvas></div></section>
  <section class="panel"><p class="hint">建议先标定 frame 3 的中立帧：躯干垂直、双脚接近并拢；再检查 frame 0 与 frame 4 是否分别为两条腿的相反前摆。双臂必须随相位交换。</p><textarea id="json" spellcheck="false"></textarea></section>
</main>
<script>
const frameCount=8;
const layerNames=['torso','arms','lower_body','feet'];
const layerLabels={torso:'躯干',arms:'双臂',lower_body:'下半身',feet:'双脚'};
const images={};
let selectedFrame=0;
let selectedLayer='torso';
let dragging=false;
let dragStart=null;
const offsets=Array.from({length:frameCount},()=>Object.fromEntries(layerNames.map(layer=>[layer,{x:0,y:0}])));
function path(layer,frame){return `assets/body_candidate_v6/${layer}/right_frame${frame}.png`;}
function moveItem(){return offsets[selectedFrame][selectedLayer];}
function loadImage(key,url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{images[key]=image;resolve();};image.onerror=reject;image.src=url;});}
async function load(){
  for(const layer of layerNames)for(let frame=0;frame<frameCount;frame++)await loadImage(`${layer}_${frame}`,path(layer,frame));
  try{const response=await fetch('calibration/body_components_latest.json');if(response.ok){const payload=await response.json();if(payload.schema==='walk_body_component_anchor_calibration_v1'&&Array.isArray(payload.frames)){for(let frame=0;frame<frameCount;frame++)for(const layer of layerNames){const value=payload.frames[frame]?.[layer];if(value)offsets[frame][layer]={x:Number(value.x)||0,y:Number(value.y)||0};}}}}catch(_error){}
  render();
}
function draw(){
  const canvas=document.getElementById('canvas');const scale=Math.max(5,Math.floor(canvas.clientWidth/64));canvas.width=64*scale;canvas.height=64*scale;
  const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const layer of layerNames){const item=offsets[selectedFrame][layer];const image=images[`${layer}_${selectedFrame}`];ctx.drawImage(image,item.x*scale,item.y*scale,64*scale,64*scale);}
  const guide=(y,color,label)=>{ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,scale/2);ctx.beginPath();ctx.moveTo(0,y*scale);ctx.lineTo(64*scale,y*scale);ctx.stroke();ctx.fillStyle=color;ctx.font=`${Math.max(10,scale*2)}px system-ui`;ctx.fillText(label,2*scale,(y-1)*scale);};
  guide(31,'#66e3a7','shoulder');guide(43,'#8fd3ff','pelvis seam');guide(58,'#b8bacb','foot baseline');
}
function render(){draw();document.querySelectorAll('[data-frame]').forEach(button=>button.classList.toggle('active',Number(button.dataset.frame)===selectedFrame));document.querySelectorAll('[data-layer]').forEach(button=>button.classList.toggle('active',button.dataset.layer===selectedLayer));const item=moveItem();document.getElementById('status').textContent=`frame ${selectedFrame} / ${layerLabels[selectedLayer]} / x=${item.x}, y=${item.y}`;document.getElementById('json').value=JSON.stringify({schema:'walk_body_component_anchor_calibration_v1',created_at:new Date().toISOString(),direction:'right',cell_size:[64,64],frames:offsets},null,2);}
function shift(dx,dy){const step=Number(document.getElementById('step').value);const item=moveItem();item.x=Number((item.x+dx*step).toFixed(2));item.y=Number((item.y+dy*step).toFixed(2));render();}
function pointerPosition(event){const rect=document.getElementById('canvas').getBoundingClientRect();return {x:(event.clientX-rect.left)/rect.width*64,y:(event.clientY-rect.top)/rect.height*64};}
document.getElementById('frames').innerHTML=Array.from({length:frameCount},(_,frame)=>`<button data-frame="${frame}">${frame}</button>`).join('');
document.getElementById('layers').innerHTML=layerNames.map(layer=>`<button data-layer="${layer}">${layerLabels[layer]}</button>`).join('');
document.querySelectorAll('[data-frame]').forEach(button=>button.onclick=()=>{selectedFrame=Number(button.dataset.frame);render();});
document.querySelectorAll('[data-layer]').forEach(button=>button.onclick=()=>{selectedLayer=button.dataset.layer;render();});
document.querySelectorAll('[data-move]').forEach(button=>button.onclick=()=>{const value={up:[0,-1],left:[-1,0],center:[0,0],right:[1,0],down:[0,1]}[button.dataset.move];if(button.dataset.move==='center'){offsets[selectedFrame][selectedLayer]={x:0,y:0};render();}else shift(value[0],value[1]);});
document.getElementById('reset').onclick=()=>{offsets[selectedFrame][selectedLayer]={x:0,y:0};render();};
document.getElementById('resetFrame').onclick=()=>{for(const layer of layerNames)offsets[selectedFrame][layer]={x:0,y:0};render();};
document.getElementById('resetAll').onclick=()=>{for(const frame of offsets)for(const layer of layerNames)frame[layer]={x:0,y:0};render();};
document.getElementById('download').onclick=()=>{const blob=new Blob([document.getElementById('json').value],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='body_components_calibration.json';link.click();URL.revokeObjectURL(link.href);};
document.getElementById('save').onclick=async()=>{try{const response=await fetch('/api/save-calibration',{method:'POST',headers:{'Content-Type':'application/json'},body:document.getElementById('json').value});if(!response.ok)throw new Error(await response.text());document.getElementById('status').textContent='已保存到 prototype/preview/calibration/body_components_latest.json';}catch(error){document.getElementById('status').textContent='保存失败，请下载 JSON：'+error;}};
const canvas=document.getElementById('canvas');canvas.addEventListener('pointerdown',event=>{dragging=true;canvas.setPointerCapture(event.pointerId);dragStart=pointerPosition(event);});canvas.addEventListener('pointermove',event=>{if(!dragging)return;const current=pointerPosition(event);const dx=Math.round(current.x-dragStart.x);const dy=Math.round(current.y-dragStart.y);if(dx||dy){shift(dx,dy);dragStart=current;}});canvas.addEventListener('pointerup',()=>{dragging=false;});
load().catch(error=>document.getElementById('status').textContent='加载失败：'+error);
</script>
</body>
</html>
