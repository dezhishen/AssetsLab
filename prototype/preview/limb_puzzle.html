<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肢体矩形拼装台</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,"Microsoft YaHei",sans-serif; background:#10131d; color:#edf1ff; }
    body { margin:0; } main { max-width:1080px; margin:auto; padding:20px; }
    h1 { font-size:1.25rem; margin:0 0 8px; } p { color:#b9c2df; margin:0 0 14px; }
    .toolbar,.frames,.palette,.actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; }
    button { color:inherit; background:#222a40; border:1px solid #3c496b; border-radius:7px; padding:7px 10px; cursor:pointer; font:inherit; }
    button:hover,button.active { background:#425986; border-color:#8fc4ff; }
    .workspace { display:grid; grid-template-columns:minmax(300px,512px) minmax(250px,1fr); gap:20px; align-items:start; }
    canvas { display:block; width:min(100%,512px); aspect-ratio:1; background:#0c0f1a; border:1px solid #3c496b; border-radius:10px; touch-action:none; image-rendering:pixelated; }
    .panel { padding:14px; background:#181d2c; border:1px solid #303b57; border-radius:10px; }
    .part { min-width:112px; text-align:left; } .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
    #status,.hint { color:#aeb9d9; font-size:.9rem; line-height:1.55; } .file { display:none; }
    @media(max-width:760px) { .workspace { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>肢体矩形拼装台</h1>
  <p>矩形是姿态参考，不是最终像素。拖动矩形即可摆放；用旋转和层级按钮明确前后遮挡。</p>
  <div class="frames" id="frames" aria-label="动作帧"></div>
  <div class="workspace">
    <canvas id="board" width="512" height="512" aria-label="64像素肢体矩形拼装画板"></canvas>
    <section class="panel">
      <div class="palette" id="palette" aria-label="肢体选择"></div>
      <div class="toolbar">
        <button id="rotateLeft">旋转 -5°</button>
        <button id="rotateRight">旋转 +5°</button>
        <button id="sendBack">下移一层</button>
        <button id="bringFront">上移一层</button>
      </div>
      <div class="actions">
        <button id="copyPrev">复制上一帧</button>
        <button id="resetFrame">重置当前帧</button>
        <button id="play">播放</button>
      </div>
      <div class="actions">
        <button id="exportJson">导出拼装 JSON</button>
        <button id="importButton">导入拼装 JSON</button>
        <input id="importFile" class="file" type="file" accept="application/json,.json">
      </div>
      <div id="status"></div>
      <p class="hint">数值越大越靠前。躯干固定为 10；建议远侧肢体设为 5，近侧肢体设为 15。</p>
    </section>
  </div>
</main>
<script>
  const SIZE=64, SCALE=8;
  const ORDER=['contact_a','down_a','passing_a','up_a','contact_b','down_b','passing_b','up_b'];
  const LABEL=['接触 A','下沉 A','经过 A','抬升 A','接触 B','下沉 B','经过 B','抬升 B'];
  const PARTS={
    left_hand:{label:'左手',color:'#5cc8ff',w:3,z:15}, right_hand:{label:'右手',color:'#ff7272',w:3,z:5},
    left_foot:{label:'左脚',color:'#73e28d',w:4,z:15}, right_foot:{label:'右脚',color:'#ffcf60',w:4,z:5}
  };
  const STROKES=[
    {left_hand:[[36.25,36.52],[44.35,40.82]],right_hand:[[31.15,35.12],[16.65,41.82]],left_foot:[[30.55,48.12],[19.25,54.62]],right_foot:[[30.75,46.02],[44.15,55.82]]},
    {left_hand:[[35.55,36.02],[41.25,43.22]],right_hand:[[30.65,34.52],[21.35,44.22]],left_foot:[[30.35,48.62],[22.85,56.62]],right_foot:[[31.15,45.02],[39.45,56.52]]},
    {left_hand:[[35.35,35.82],[38.95,45.52]],right_hand:[[31.65,35.72],[24.75,45.32]],left_foot:[[33.75,47.12],[33.95,56.52]],right_foot:[[32.25,45.32],[30.35,56.12]]},
    {left_hand:[[30.25,37.22],[22.45,46.62]],right_hand:[[34.35,37.62],[42.05,46.52]],left_foot:[[34.75,47.12],[42.15,56.52]],right_foot:[[31.85,46.22],[25.15,55.82]]},
    {left_hand:[[28.95,41.92],[18.75,41.92]],right_hand:[[34.45,37.22],[45.55,41.32]],left_foot:[[34.65,46.72],[45.45,54.92]],right_foot:[[32.65,45.52],[21.05,53.82]]},
    {left_hand:[[29.15,38.02],[22.05,45.32]],right_hand:[[34.45,37.62],[40.45,48.12]],left_foot:[[35.05,47.32],[40.45,57.22]],right_foot:[[30.25,47.72],[26.45,57.62]]},
    {left_hand:[[30.95,38.42],[27.45,48.62]],right_hand:[[33.35,38.42],[35.45,49.52]],left_foot:[[33.65,49.92],[36.05,58.32]],right_foot:[[32.05,49.22],[32.75,58.42]]},
    {left_hand:[[34.15,39.02],[42.35,45.62]],right_hand:[[31.65,39.62],[24.75,49.82]],left_foot:[[30.95,48.22],[23.85,57.02]],right_foot:[[31.65,48.62],[40.35,56.42]]}
  ];
  function fromStroke(a,b,spec){const dx=b[0]-a[0],dy=b[1]-a[1];return{x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,w:spec.w,h:Math.max(5,Math.hypot(dx,dy)),angle:Math.atan2(dx,dy)*180/Math.PI,z_order:spec.z};}
  function defaults(){return STROKES.map(frame=>{const parts={};for(const [key,spec] of Object.entries(PARTS))parts[key]=fromStroke(frame[key][0],frame[key][1],spec);return{parts};});}
  const board=document.getElementById('board'),ctx=board.getContext('2d'); let frames=defaults(),frameIndex=0,selected='left_hand',drag=null,playing=false,timer=null;
  const clone=value=>JSON.parse(JSON.stringify(value));
  const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
  function screenPoint(event){const rect=board.getBoundingClientRect();return[(event.clientX-rect.left)/rect.width*SIZE,(event.clientY-rect.top)/rect.height*SIZE];}
  function drawGrid(){ctx.fillStyle='#0c0f1a';ctx.fillRect(0,0,512,512);for(let i=0;i<=64;i++){ctx.strokeStyle=i%8===0?'#ffffff24':'#ffffff0d';ctx.beginPath();ctx.moveTo(i*SCALE,0);ctx.lineTo(i*SCALE,512);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*SCALE);ctx.lineTo(512,i*SCALE);ctx.stroke();}ctx.strokeStyle='#8fc4ff88';ctx.beginPath();ctx.moveTo(256,0);ctx.lineTo(256,512);ctx.stroke();ctx.strokeStyle='#73e28d88';ctx.beginPath();ctx.moveTo(0,58*SCALE);ctx.lineTo(512,58*SCALE);ctx.stroke();}
  function drawRect(part,key,active){const spec=PARTS[key];ctx.save();ctx.translate(part.x*SCALE,part.y*SCALE);ctx.rotate(part.angle*Math.PI/180);ctx.fillStyle=spec.color+'99';ctx.strokeStyle=spec.color;ctx.lineWidth=3;ctx.fillRect(-part.w*SCALE/2,-part.h*SCALE/2,part.w*SCALE,part.h*SCALE);ctx.strokeRect(-part.w*SCALE/2,-part.h*SCALE/2,part.w*SCALE,part.h*SCALE);if(active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-part.w*SCALE/2-4,-part.h*SCALE/2-4,part.w*SCALE+8,part.h*SCALE+8);}ctx.restore();}
  function drawTorso(){ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#c6cce0';ctx.strokeStyle='#eef2ff';ctx.lineWidth=2;ctx.fillRect(28*SCALE,35*SCALE,8*SCALE,13*SCALE);ctx.strokeRect(28*SCALE,35*SCALE,8*SCALE,13*SCALE);ctx.restore();}
  function render(){drawGrid();drawTorso();const parts=frames[frameIndex].parts;Object.keys(PARTS).sort((a,b)=>parts[a].z_order-parts[b].z_order).forEach(key=>drawRect(parts[key],key,key===selected));document.querySelectorAll('#frames button').forEach((b,i)=>b.classList.toggle('active',i===frameIndex));document.querySelectorAll('#palette button').forEach(b=>b.classList.toggle('active',b.dataset.part===selected));document.getElementById('status').textContent=`第 ${frameIndex+1}/8 帧：${LABEL[frameIndex]}；${PARTS[selected].label} 的 z_order = ${parts[selected].z_order}`;}
  function buildButtons(){const tab=document.getElementById('frames'),palette=document.getElementById('palette');ORDER.forEach((_,i)=>{const b=document.createElement('button');b.textContent=`${i+1} ${LABEL[i]}`;b.onclick=()=>{frameIndex=i;render();};tab.appendChild(b);});Object.entries(PARTS).forEach(([key,spec])=>{const b=document.createElement('button');b.className='part';b.dataset.part=key;b.innerHTML=`<span class="swatch" style="background:${spec.color}"></span>${spec.label}`;b.onclick=()=>{selected=key;render();};palette.appendChild(b);});}
  function contains(part,x,y){const r=-part.angle*Math.PI/180,dx=x-part.x,dy=y-part.y,localX=Math.cos(r)*dx-Math.sin(r)*dy,localY=Math.sin(r)*dx+Math.cos(r)*dy;return Math.abs(localX)<=part.w/2&&Math.abs(localY)<=part.h/2;}
  board.addEventListener('pointerdown',event=>{const [x,y]=screenPoint(event),parts=frames[frameIndex].parts,hit=Object.keys(PARTS).sort((a,b)=>parts[b].z_order-parts[a].z_order).find(key=>contains(parts[key],x,y));if(hit){selected=hit;drag={offsetX:x-parts[hit].x,offsetY:y-parts[hit].y};board.setPointerCapture(event.pointerId);render();}});
  board.addEventListener('pointermove',event=>{if(!drag)return;const [x,y]=screenPoint(event),part=frames[frameIndex].parts[selected];part.x=clamp(x-drag.offsetX,0,64);part.y=clamp(y-drag.offsetY,0,64);render();});board.addEventListener('pointerup',()=>drag=null);board.addEventListener('pointercancel',()=>drag=null);
  document.getElementById('rotateLeft').onclick=()=>{frames[frameIndex].parts[selected].angle-=5;render();};document.getElementById('rotateRight').onclick=()=>{frames[frameIndex].parts[selected].angle+=5;render();};document.getElementById('sendBack').onclick=()=>{frames[frameIndex].parts[selected].z_order--;render();};document.getElementById('bringFront').onclick=()=>{frames[frameIndex].parts[selected].z_order++;render();};
  document.getElementById('copyPrev').onclick=()=>{if(frameIndex){frames[frameIndex]=clone(frames[frameIndex-1]);render();}};document.getElementById('resetFrame').onclick=()=>{frames[frameIndex]=defaults()[frameIndex];render();};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'停止':'播放';if(playing)timer=setInterval(()=>{frameIndex=(frameIndex+1)%8;render();},150);else clearInterval(timer);};
  function payload(){return{schema:'limb_puzzle_v1',cell_size:[64,64],direction:'right',frame_order:ORDER,torso:{x:32,y:41.5,w:8,h:13,z_order:10},frames};}
  document.getElementById('exportJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='limb_puzzle.json';a.click();URL.revokeObjectURL(a.href);};
  document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.schema!=='limb_puzzle_v1'||!Array.isArray(data.frames)||data.frames.length!==8)throw new Error('文件不是 8 帧 limb_puzzle_v1');for(const item of data.frames)for(const key of Object.keys(PARTS))if(!item.parts?.[key]||typeof item.parts[key].z_order!=='number')throw new Error(`缺少 ${key} 或 z_order`);frames=data.frames;render();}catch(error){alert(`导入失败：${error.message}`);}};reader.readAsText(file,'utf-8');};
  buildButtons();render();
</script>
</body>
</html>
