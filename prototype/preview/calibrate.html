<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AssetsLab Anchor Calibration</title>
  <style>
    :root { color-scheme: dark; --bg:#161827; --panel:#22253a; --line:#414660; --text:#f2f1ee; --muted:#b8bacb; --accent:#8fd3ff; --pink:#ff53be; --yellow:#ffd54d; }
    * { box-sizing:border-box; }
    body { margin:0; padding:14px; background:linear-gradient(160deg,#151725,#20243a); color:var(--text); font:16px/1.45 system-ui,sans-serif; }
    main { max-width:1100px; margin:auto; }
    h1 { margin:0 0 4px; font-size:clamp(22px,5vw,34px); }
    p { color:var(--muted); margin:6px 0 12px; }
    .toolbar,.panel { background:rgba(34,37,58,.95); border:1px solid var(--line); border-radius:14px; padding:12px; margin:12px 0; }
    .toolbar { display:grid; gap:10px; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
    label { color:var(--muted); }
    select,button,textarea { font:inherit; color:var(--text); background:#303550; border:1px solid #59617f; border-radius:8px; padding:8px 10px; }
    button { cursor:pointer; min-width:42px; }
    button:active { background:#526080; }
    .direction button.active,.component button.active { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .move { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,44px); gap:5px; width:max-content; margin:2px auto; }
    .move button:nth-child(1) { grid-column:2; }
    .move button:nth-child(2) { grid-column:1; grid-row:2; }
    .move button:nth-child(3) { grid-column:2; grid-row:2; }
    .move button:nth-child(4) { grid-column:3; grid-row:2; }
    .move button:nth-child(5) { grid-column:2; grid-row:3; }
    .view { max-width:560px; margin:auto; background:#0d0f19; border:1px solid var(--line); border-radius:12px; padding:8px; }
    .view-title { color:var(--accent); padding:4px 2px 8px; }
    canvas { width:100%; display:block; image-rendering:pixelated; background:#0b0c13; border-radius:8px; }
    .caption { color:var(--muted); padding:7px 2px 0; font-size:14px; }
    .status { color:#c9f5c9; min-height:1.5em; }
    textarea { width:100%; min-height:150px; font:12px/1.35 ui-monospace,Consolas,monospace; }
    @media (max-width:650px) { body { padding:9px; } }
  </style>
</head>
<body>
<main>
  <h1>AssetsLab 部件锚点校准</h1>
  <p>移动的是运行时图层的相对位置。青色框是头部轮廓，粉色点是脸部锚点，黄色点是耳朵锚点。校准结果保存后，我会读取 JSON 转换为正式锚点。</p>

  <section class="toolbar">
    <div class="row direction"><label>方向：</label><button data-direction="front">1 正脸</button><button data-direction="right">2 右脸</button><button data-direction="back">3 背脸</button><button data-direction="left">4 左脸</button></div>
    <div class="row component"><label>部件：</label><button data-component="face">脸部</button><button data-component="ear_left">左耳</button><button data-component="ear_right">右耳</button><button data-component="ear">侧脸耳朵</button></div>
    <div class="row"><label>步长：</label><select id="step"><option value="1">1 像素</option><option value="2">2 像素</option><option value="0.25">0.25 像素</option></select><button id="reset">重置当前部件</button><button id="resetAll">重置全部</button><button id="save">保存到项目</button><button id="download">下载 JSON</button></div>
    <div class="move"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="center">·</button><button data-move="right">→</button><button data-move="down">↓</button></div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel"><div class="view"><div class="view-title" id="viewTitle"></div><canvas id="canvas"></canvas></div></section>
  <section class="panel"><label for="json">当前校准 JSON（保存失败时可复制给我）</label><textarea id="json" spellcheck="false"></textarea></section>
</main>
<script>
const directions = ['front','right','back','left'];
const labels = {front:'1 · 正脸',right:'2 · 右脸',back:'3 · 背脸',left:'4 · 左脸'};
const runtime = {
  base:'assets/runtime/face_base_walk_4way.png',
  face:'assets/runtime/face_walk_4way.png',
  ears:'assets/runtime/ears_walk_4way.png'
};
let targets = {};
let registrations = {};
let selectedDirection = 'front';
let selectedComponent = 'face';
let calibration = {};
const images = {};

function emptyOffsets() {
  const result = {};
  for (const direction of directions) {
    result[direction] = {face:{x:0,y:0}, ear:{x:0,y:0}, ear_left:{x:0,y:0}, ear_right:{x:0,y:0}};
  }
  return result;
}
calibration = emptyOffsets();

async function loadManifest() {
  const response = await fetch('assets/runtime/runtime_manifest.json');
  const manifest = await response.json();
  targets = manifest.anchor_targets;
  registrations = manifest.registrations;
  for (const key of ['base','face','ears']) { images[key] = new Image(); images[key].src = runtime[key]; await new Promise(resolve => images[key].onload = resolve); }
  render();
}

function frameContext(canvas, direction) {
  const scale = Math.max(4, Math.floor(canvas.clientWidth / 64));
  canvas.width = 64 * scale; canvas.height = 64 * scale;
  const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const row = directions.indexOf(direction); const sourceY = row * 64;
  ctx.drawImage(images.base,0,sourceY,64,64,0,0,canvas.width,canvas.height);
  drawPart(ctx, images.ears, sourceY, direction, 'ears', scale);
  drawPart(ctx, images.face, sourceY, direction, 'face', scale);
  drawAnchors(ctx, direction, scale);
  return ctx;
}

function offset(direction, component) { return calibration[direction][component] || {x:0,y:0}; }
function drawPart(ctx, image, sourceY, direction, component, scale) {
  const isPair = component === 'ears' && (direction === 'front' || direction === 'back');
  if (isPair) {
    drawSubPart(ctx,image,sourceY,0,32,offset(direction,'ear_left'),scale);
    drawSubPart(ctx,image,sourceY,32,32,offset(direction,'ear_right'),scale);
  } else {
    const key = component === 'ears' ? (direction === 'front' || direction === 'back' ? 'ear_left' : 'ear') : 'face';
    drawSubPart(ctx,image,sourceY,0,64,offset(direction,key),scale);
  }
}
function drawSubPart(ctx,image,sourceY,sourceX,width,move,scale) {
  ctx.drawImage(image,sourceX,sourceY,width,64,sourceX*scale+move.x*scale,move.y*scale,width*scale,64*scale);
}
function drawAnchors(ctx,direction,scale) {
  const reg = registrations[direction];
  ctx.strokeStyle='#5bdcff'; ctx.lineWidth=1*scale; const b=reg.head.bbox; ctx.strokeRect(b[0]*scale,b[1]*scale,(b[2]-b[0])*scale,(b[3]-b[1])*scale);
  const t=targets[direction];
  for (const key of ['face_center','ear_left','ear_right','ear']) if (t[key]) { const color=key==='face_center'?'#ff53be':'#ffd54d'; ctx.strokeStyle=color; ctx.beginPath(); ctx.arc(t[key][0]*scale,t[key][1]*scale,2.5*scale,0,Math.PI*2); ctx.stroke(); }
}

function render() {
  document.getElementById('viewTitle').textContent=labels[selectedDirection]+' · 当前仅显示此方向';
  frameContext(document.getElementById('canvas'),selectedDirection);
  document.getElementById('json').value=JSON.stringify({schema:'component_anchor_calibration_v1',created_at:new Date().toISOString(),calibration},null,2);
  updateButtons();
  const current=offset(selectedDirection,selectedComponent); document.getElementById('status').textContent=`当前：${labels[selectedDirection]} / ${selectedComponent}，偏移 x=${current.x}, y=${current.y}`;
}
function updateButtons() {
  document.querySelectorAll('[data-direction]').forEach(b=>b.classList.toggle('active',b.dataset.direction===selectedDirection));
  const available=(selectedDirection==='front'||selectedDirection==='back')?['face','ear_left','ear_right']:['face','ear'];
  if(!available.includes(selectedComponent)) selectedComponent=available[0];
  document.querySelectorAll('[data-component]').forEach(b=>{b.style.display=available.includes(b.dataset.component)?'inline-block':'none';b.classList.toggle('active',b.dataset.component===selectedComponent);});
}
function move(dx,dy) { const step=Number(document.getElementById('step').value); const item=offset(selectedDirection,selectedComponent); item.x=Number((item.x+dx*step).toFixed(2)); item.y=Number((item.y+dy*step).toFixed(2)); render(); }
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{selectedDirection=b.dataset.direction;render();});
document.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>{selectedComponent=b.dataset.component;render();});
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],left:[-1,0],center:[0,0],right:[1,0],down:[0,1]}[b.dataset.move]; if(b.dataset.move!=='center') move(m[0],m[1]);});
document.getElementById('reset').onclick=()=>{calibration[selectedDirection][selectedComponent]={x:0,y:0};render();};
document.getElementById('resetAll').onclick=()=>{calibration=emptyOffsets();render();};
document.getElementById('download').onclick=()=>{const blob=new Blob([document.getElementById('json').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='component_anchor_calibration.json';a.click();URL.revokeObjectURL(a.href);};
document.getElementById('save').onclick=async()=>{const status=document.getElementById('status');try{const response=await fetch('/api/save-calibration',{method:'POST',headers:{'Content-Type':'application/json'},body:document.getElementById('json').value});if(!response.ok)throw new Error(await response.text());status.textContent='已保存到项目 prototype/preview/calibration/latest.json';}catch(error){status.textContent='保存失败，请使用“下载 JSON”后发给我：'+error;}};
loadManifest().catch(error=>document.getElementById('status').textContent='加载失败：'+error);
</script>
</body>
</html>
